name: Daily scanner

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: delta_scanner_state.sqlite3
          key: delta-state-${{ github.run_id }}
          restore-keys: |
            delta-state-

      - name: Run one scan
        run: python main.py --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCANNER_EXCHANGE: delta
          DELTA_API_BASE_URL: https://api.india.delta.exchange
          DELTA_SYMBOLS: BTCUSD,ETHUSD,SOLUSD,XRPUSD

      - name: Save scanner state
        if: success()
        uses: actions/cache/save@v4
        with:
          path: delta_scanner_state.sqlite3
          key: delta-state-${{ github.run_id }}
