name: Delta scanner

on:
  schedule:
    - cron: "0,15,30,45 * * * *"
    - cron: "0 * * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Restore scanner state
        uses: actions/cache/restore@v4
        with:
          path: |
            delta_scanner_state.sqlite3
            bingx_scanner_state.sqlite3
            delta_scanner_1h_state.sqlite3
            bingx_scanner_1h_state.sqlite3
            delta_scanner_1d_state.sqlite3
            bingx_scanner_1d_state.sqlite3
          key: scanner-state-${{ github.run_id }}
          restore-keys: |
            scanner-state-
            delta-state-

      - name: Run 15-minute scan
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0,15,30,45 * * * *'
        run: python main.py --once --timeframe 15m
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DELTA_API_BASE_URL: https://api.india.delta.exchange
          DELTA_15M_SYMBOLS: BTCUSD,ETHUSD,SOLUSD,XRPUSD
          BINGX_API_BASE_URL: https://open-api.bingx.com
          BINGX_15M_SYMBOLS: BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT

      - name: Run hourly scan
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 * * * *'
        run: python main.py --once --timeframe 1h
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DELTA_API_BASE_URL: https://api.india.delta.exchange
          DELTA_1H_SYMBOLS: BTCUSD,ETHUSD,SOLUSD,XRPUSD
          BINGX_API_BASE_URL: https://open-api.bingx.com
          BINGX_1H_SYMBOLS: BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT

      - name: Run daily scan
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 0 * * *'
        run: python main.py --once --timeframe 1d
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DELTA_API_BASE_URL: https://api.india.delta.exchange
          DELTA_1D_SYMBOLS: BTCUSD,ETHUSD,SOLUSD,XRPUSD
          BINGX_API_BASE_URL: https://open-api.bingx.com
          BINGX_1D_SYMBOLS: BTC-USDT,ETH-USDT,SOL-USDT,XRP-USDT

      - name: Save scanner state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            delta_scanner_state.sqlite3
            bingx_scanner_state.sqlite3
            delta_scanner_1h_state.sqlite3
            bingx_scanner_1h_state.sqlite3
            delta_scanner_1d_state.sqlite3
            bingx_scanner_1d_state.sqlite3
          key: scanner-state-${{ github.run_id }}
